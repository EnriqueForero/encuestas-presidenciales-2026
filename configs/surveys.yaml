# ════════════════════════════════════════════════════════════════════════════
#  REGISTRO DE ENCUESTAS
# ════════════════════════════════════════════════════════════════════════════
#
# Agregar una encuesta nueva NO requiere modificar código Python.
# Si el formato ya está soportado (atlas | gad3_excel | gad3_sav | invamer | cnc_sav | cnc_excel),
# basta con añadir una entrada a `surveys`.
#
# Si la encuestadora es nueva (Guarumo, Datexco, ...) ver README §"Agregar
# una nueva encuesta — Caso 2": crear un Reader nuevo en
# encuestas_lib/readers/ y registrarlo en registry.py.
#
# Campos obligatorios:
#   id            : identificador único (snake_case, prefijo = encuestadora)
#   encuestadora  : nombre canónico para reportes
#   fecha         : ISO YYYY-MM-DD (mid-fieldwork o cierre)
#   reader        : nombre registrado en encuestas_lib/readers/registry.py
#   path          : ruta relativa a `paths.raw_dir` del config
#
# Campos opcionales:
#   n_muestra     : tamaño muestral declarado (usado para ponderación)
#   nota          : metadata libre (p. ej., versión de cuestionario)
# ════════════════════════════════════════════════════════════════════════════

