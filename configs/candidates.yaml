# ════════════════════════════════════════════════════════════════════════════
#  CANDIDATOS CANÓNICOS — PRESIDENCIALES COLOMBIA 2026
# ════════════════════════════════════════════════════════════════════════════
#
# Única fuente de verdad para nombres de candidatos. Cualquier cambio
# (retiro, ingreso, fusión de coaliciones) se modifica AQUÍ, no en código.
#
# Campos:
#   canonical    : nombre canónico (cómo se reporta en tablas finales)
#   key          : llave corta para nombres de columnas (snake_case, sin tildes)
#   status       : "vigente" | "retirado" | "no_oficializado"
#   aliases      : patrones regex para detección en microdatos crudos
#                  (orden importa: específico antes que genérico)
#   bloque       : "izquierda" | "centro" | "derecha" | "otro" (uso descriptivo)
# ════════════════════════════════════════════════════════════════════════════

