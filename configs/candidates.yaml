# Categorías especiales (no son candidatos pero pueden aparecer en P. de voto)
special_categories:
  - canonical: Voto en blanco
    key: blanco
    aliases:
      - "voto.*blanco"
      - "en blanco"
      - "blanco.*nulo"
      - "blank"
      - "nulo"

  - canonical: NS/NR
    key: ns_nr
    aliases:
      - "ns/nc"
      - "ns/nr"
      - "no sabe"
      - "no responde"
      - "^ns$"
      - "^nr$"
      - "nsnr"

  - canonical: Ninguno
    key: ninguno
    aliases: ["ninguno"]

  - canonical: No votaría
    key: no_votaria
    aliases:
      - "no votar"
      - "no ira"
      - "no piensa"
      - "no votaria"

  - canonical: Otro candidato
    key: otro
    aliases:
      - "otro candidato"
      - "^otro$"

  - canonical: No sé
    key: no_se
    aliases:
      - "no se"
      - "no sabe"

# Las categorías "blanco", "ns_nr", "ninguno", "no_votaria", "otro", "no_se"
# son tratadas como INDECISOS por analysis/tables.py (configurable).
